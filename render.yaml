services:
  - type: web
    name: bugzilla-app
    runtime: node
    buildCommand: npm install && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugzilla-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: bugzilla-db
    databaseName: bugzilla
    user: bugzilla_user
    plan: free
